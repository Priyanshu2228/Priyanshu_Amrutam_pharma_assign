version: 2
# Security advisories still raise immediate PRs regardless of this schedule.
# Routine updates are batched: one grouped PR per ecosystem per month, minor/patch only.
# Major upgrades are done deliberately (they need code changes and a full test run).
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: monthly }
