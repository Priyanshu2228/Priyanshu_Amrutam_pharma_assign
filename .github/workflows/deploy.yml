name: Deploy

# Promotes an image that already passed CI. Runs migrations as a one-off task first
# (forward-compatible "expand" migrations only), then rolls the services; ECS's deployment
# circuit breaker rolls back automatically if new tasks fail health checks.
on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Commit SHA of the image to deploy
        required: true
      environment:
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write # OIDC to AWS: no long-lived cloud credentials in GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # production requires a manual approval
    env:
      IMAGE: ghcr.io/${{ github.repository }}/api:${{ inputs.image_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform plan and apply
        working-directory: infra/terraform
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=ap-south-1"
          terraform workspace select -or-create ${{ inputs.environment }}
          terraform apply -auto-approve \
            -var="environment=${{ inputs.environment }}" \
            -var="image=${IMAGE}" \
            -var="domain_certificate_arn=${{ vars.ACM_CERT_ARN }}"
      - name: Run database migrations
        run: |
          CLUSTER=amrutam-${{ inputs.environment }}
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE \
            --task-definition "$CLUSTER-migrate" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNETS }}],securityGroups=[${{ vars.APP_SG }}]}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode')
          test "$EXIT" = "0"
      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable --cluster amrutam-${{ inputs.environment }} --services api worker
